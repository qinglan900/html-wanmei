<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>皖美 E 行 - 横屏首页优化版</title>
  <style>
    :root {
      --primary: #4CAF50;
      --primary-dark: #388E3C;
      --primary-light: #66BB6A;
      --primary-bg: #E8F5E9;
      --white: #FFFFFF;
      --bg: #F8F8F8;
      --text-primary: #333;
      --text-secondary: #666;
      --text-muted: #999;
      --border: #E8E8E8;
      --warning: #FF9800;
      --danger: #F44336;
      --info: #2196F3;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #D8D8D8;
      overflow: hidden;
    }

    .app-container {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      height: 40px;
      background: var(--white);
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .top-bar-left {
      width: 65%;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 4px;
    }

    .top-bar-right {
      width: 35%;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      justify-content: space-between;
    }

    .top-logo {
      font-size: 16px;
      font-weight: bold;
      color: var(--primary);
      white-space: nowrap;
      flex-shrink: 0;
    }

    .logo-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      flex-shrink: 0;
    }

    .tab-item {
      height: 38px;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      color: var(--text-secondary);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-item:hover { color: var(--primary); }

    .tab-item.active {
      color: var(--primary);
      font-weight: 600;
      border-bottom-color: var(--primary);
    }

    .top-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      flex-shrink: 0;
    }

    .top-search {
      flex: 1;
      max-width: 220px;
      height: 32px;
      background: var(--bg);
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .top-search input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 12px;
      color: var(--text-primary);
      outline: none;
    }

    .top-search input::placeholder { color: var(--text-muted); }

    .top-vehicle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-secondary);
      flex-shrink: 0;
      margin-left: auto;
      position: relative;
      cursor: pointer;
    }

    .top-vehicle .msg-icon {
      position: relative;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-vehicle .msg-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      min-width: 16px;
      height: 16px;
      background: var(--danger);
      color: var(--white);
      border-radius: 8px;
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
      line-height: 1;
    }

    .top-vehicle .plate {
      background: var(--primary);
      color: var(--white);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    /* ===== 主内容区 ===== */
    .main-area {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* 左侧内容区 65% */
    .left-content {
      width: 65%;
      overflow-y: auto;
      padding: 14px;
      border-right: 1px solid var(--border);
      background: var(--bg);
    }

    /* Banner */
    .banner {
      height: 110px;
      border-radius: 12px;
      background-image: url('https://qinglan900.github.io/html-wanmei/images/首页banner.jpg');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      margin-bottom: 12px;
    }

    .banner-text {
      text-align: center;
      color: var(--white);
      z-index: 1;
    }

    .banner-title {
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0,0,0,0.15);
      margin-bottom: 4px;
    }

    .banner-subtitle {
      font-size: 12px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.1);
      opacity: 0.9;
    }

    .banner-deco {
      position: absolute;
      font-size: 28px;
      opacity: 0.5;
    }

    .banner-deco.left { left: 16px; top: 10px; }
    .banner-deco.top-left { left: 60px; top: 8px; font-size: 18px; }

    /* 公告 */
    .notice-bar {
      background: #FFFDE7;
      border-radius: 8px;
      padding: 8px 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 12px;
      color: #F57F17;
    }

    /* 服务卡片 */
    .service-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 12px;
    }

    .service-card {
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
      min-height: 80px;
    }

    .service-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
    }

    /* 旅游服务：天蓝→青绿色渐变 */
    .service-card:nth-child(1) {
      background: linear-gradient(135deg, #4FC3F7 0%, #26C6DA 50%, #26A69A 100%);
    }

    /* 酒店预定：暖橙→珊瑚色渐变 */
    .service-card:nth-child(2) {
      background: linear-gradient(135deg, #FFB74D 0%, #FF8A65 50%, #F06292 100%);
    }

    /* 车主服务：清新绿渐变 */
    .service-card:nth-child(3) {
      background: linear-gradient(135deg, #81C784 0%, #66BB6A 50%, #4CAF50 100%);
    }

    /* 装饰性圆点 */
    .service-card::before {
      content: '';
      position: absolute;
      right: -20px;
      top: -20px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
    }

    .service-card::after {
      content: '';
      position: absolute;
      right: 20px;
      bottom: -15px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }

    .service-card-img {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(4px);
    }

    .service-card-info {
      flex: 1;
      z-index: 1;
    }

    .service-card-info h4 {
      font-size: 16px;
      color: #fff;
      margin-bottom: 4px;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }

    .service-card-info p {
      font-size: 12px;
      color: rgba(255,255,255,0.9);
    }

    /* 店铺甄选 2行×3列 */
    .shop-section {
      margin-bottom: 10px;
    }

    .shop-section h3 {
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .shop-section h3 .more {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: normal;
      cursor: pointer;
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .shop-item {
      background: var(--white);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }

    .shop-item:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    .shop-img {
      height: 110px;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }

    .shop-img-1 { background-image: url('https://qinglan900.github.io/html-wanmei/images/太湖醉虾.jpg'); }
    .shop-img-2 { background-image: url('https://qinglan900.github.io/html-wanmei/images/黄山烧饼.jpg'); }
    .shop-img-3 { background-image: url('https://qinglan900.github.io/html-wanmei/images/臭鳜鱼.jpg'); }
    .shop-img-4 { background-image: url('https://qinglan900.github.io/html-wanmei/images/六安瓜皮.jpg'); }
    .shop-img-5 { background-image: url('https://qinglan900.github.io/html-wanmei/images/霍山石斛.jpg'); }
    .shop-img-6 { background-image: url('https://qinglan900.github.io/html-wanmei/images/宣纸扇.jpg'); }

    .shop-info {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .shop-name {
      font-size: 13px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .shop-price {
      font-size: 14px;
      color: var(--danger);
      font-weight: bold;
      flex-shrink: 0;
    }

    .shop-price span {
      display: none;
    }

    /* ===== 右侧功能入口区 35% ===== */
    .right-content {
      width: 35%;
      background: var(--white);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      overflow-y: auto;
    }

    /* 功能网格 3×3 + 更多服务 */
    .section-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .section-title .more-link {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: normal;
      cursor: pointer;
    }

    .func-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .func-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 12px 4px;
      border-radius: 10px;
      transition: background 0.2s;
    }

    .func-item:hover { background: var(--bg); }

    .func-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .func-icon.green { background: var(--primary-bg); color: var(--primary); }
    .func-icon.blue { background: #E3F2FD; color: var(--info); }
    .func-icon.orange { background: #FFF3E0; color: var(--warning); }
    .func-icon.yellow { background: #FFF8E1; color: #FFC107; }
    .func-icon.purple { background: #F3E5F5; color: #9C27B0; }
    .func-icon.cyan { background: #E0F7FA; color: #00BCD4; }
    .func-icon.red { background: #FFEBEE; color: var(--danger); }
    .func-icon.gray { background: #F5F5F5; color: var(--text-muted); }

    .func-label {
      font-size: 11px;
      color: var(--text-secondary);
      text-align: center;
    }

    /* 活动广告卡片 */
    .promo-card {
      background: linear-gradient(135deg, var(--primary-bg), #C8E6C9);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .promo-card-text h3 {
      font-size: 15px;
      font-weight: 600;
      color: var(--primary-dark);
      margin-bottom: 3px;
    }

    .promo-card-text p {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .promo-card-text button {
      background: var(--primary);
      color: var(--white);
      border: none;
      padding: 5px 16px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .promo-card-text button:hover { background: var(--primary-dark); }

    .promo-card-icon {
      font-size: 40px;
      margin-left: auto;
    }

    /* ===== 底部导航 ===== */
    .bottom-nav {
      height: 56px;
      background: var(--white);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      padding: 4px 16px;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      stroke: var(--text-muted);
      fill: none;
      stroke-width: 2;
    }

    .nav-item.active svg {
      stroke: var(--primary);
    }

    .nav-item .nav-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .nav-item.active .nav-label {
      color: var(--primary);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 顶部融合栏 -->
    <header class="top-bar">
      <div class="top-bar-left">
        <div class="top-logo">皖美 E 行</div>
        <div class="logo-divider"></div>
        <div class="tab-item active">首页</div>
        <div class="tab-item">订餐</div>
        <div class="tab-item">加能</div>
        <div class="tab-item">休整</div>
      </div>
      <div class="top-bar-right">
        <div class="top-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" placeholder="搜应用/资讯/地点">
        </div>
        <div class="top-vehicle">
          <div class="msg-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
            <span class="msg-badge">3</span>
          </div>
          <span>客车</span>
          <span class="plate">皖AAT89A5</span>
        </div>
      </div>
    </header>

    <!-- 主内容区 -->
    <div class="main-area">
      <!-- ===== 左侧 65% ===== -->
      <main class="left-content">
        <!-- Banner -->
        <div class="banner"></div>

        <!-- 公告 -->
        <div class="notice-bar">
          <span>📢</span>
          <span>【临时养护施工】2026年5月12日15时，合安高速往合肥方向施工路段，临时调整交通组织……</span>
        </div>

        <!-- 服务卡片 -->
        <div class="service-cards">
          <div class="service-card">
            <div class="service-card-img blue">🏔️</div>
            <div class="service-card-info">
              <h4>旅游服务</h4>
              <p>带你游世界</p>
            </div>
          </div>
          <div class="service-card">
            <div class="service-card-img orange">🏨</div>
            <div class="service-card-info">
              <h4>酒店预定</h4>
              <p>周边超值预定</p>
            </div>
          </div>
          <div class="service-card">
            <div class="service-card-img green">🚗</div>
            <div class="service-card-info">
              <h4>车主服务</h4>
              <p>修车·停车·保险</p>
            </div>
          </div>
        </div>

        <!-- 店铺甄选 2行×3列 -->
        <div class="shop-section">
          <h3>
            <span> 店铺甄选 · 地方特产</span>
            <span class="more">更多 &gt;</span>
          </h3>
          <div class="shop-grid">
            <div class="shop-item">
              <div class="shop-img shop-img-1"></div>
              <div class="shop-info">
                <div class="shop-name">太湖醉虾</div>
                <div class="shop-price">¥38</div>
              </div>
            </div>
            <div class="shop-item">
              <div class="shop-img shop-img-2"></div>
              <div class="shop-info">
                <div class="shop-name">徽式烧饼</div>
                <div class="shop-price">¥15</div>
              </div>
            </div>
            <div class="shop-item">
              <div class="shop-img shop-img-3"></div>
              <div class="shop-info">
                <div class="shop-name">黄山臭鳜鱼</div>
                <div class="shop-price">¥68</div>
              </div>
            </div>
            <div class="shop-item">
              <div class="shop-img shop-img-4"></div>
              <div class="shop-info">
                <div class="shop-name">六安瓜片</div>
                <div class="shop-price">¥128</div>
              </div>
            </div>
            <div class="shop-item">
              <div class="shop-img shop-img-5"></div>
              <div class="shop-info">
                <div class="shop-name">霍山石斛</div>
                <div class="shop-price">¥198</div>
              </div>
            </div>
            <div class="shop-item">
              <div class="shop-img shop-img-6"></div>
              <div class="shop-info">
                <div class="shop-name">宣纸扇</div>
                <div class="shop-price">¥45</div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- ===== 右侧 35% ===== -->
      <aside class="right-content">
        <!-- 功能网格 3×3 + 更多 -->
        <div>
          <div class="section-title">
            <span>常用服务</span>
          </div>
          <div class="func-grid">
            <div class="func-item">
              <div class="func-icon green">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
              </div>
              <span class="func-label">高速补能</span>
            </div>
            <div class="func-item">
              <div class="func-icon blue">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>
              </div>
              <span class="func-label">路况查询</span>
            </div>
            <div class="func-item">
              <div class="func-icon green">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
              </div>
              <span class="func-label">服务区</span>
            </div>
            <div class="func-item">
              <div class="func-icon blue">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="14" width="20" height="6" rx="2"/><path d="M6 14V10a2 2 0 012-2h8a2 2 0 012 2v4"/></svg>
              </div>
              <span class="func-label">收费站</span>
            </div>
            <div class="func-item">
              <div class="func-icon orange">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8h1a4 4 0 010 8h-1"/><path d="M2 8h16v9a4 4 0 01-4 4H6a4 4 0 01-4-4V8z"/><line x1="6" y1="1" x2="6" y2="4"/></svg>
              </div>
              <span class="func-label">美食</span>
            </div>
            <div class="func-item">
              <div class="func-icon purple">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
              </div>
              <span class="func-label">皖美商城</span>
            </div>
            <div class="func-item">
              <div class="func-icon cyan">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              </div>
              <span class="func-label">发票查询</span>
            </div>
            <div class="func-item">
              <div class="func-icon red">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
              </div>
              <span class="func-label">e路畅通</span>
            </div>
