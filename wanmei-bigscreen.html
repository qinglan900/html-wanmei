<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>皖美 e 行 · 一体化出行服务平台 — 数据大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  :root {
    --bg-deep: #060b18;
    --bg-card: #0d1e3d;
    --border-glow: #1a3d6e;
    --border-active: #2a5da8;
    --text-primary: #e0e8f4;
    --text-secondary: #a0b8d4;
    --text-muted: #6b85a8;
    --cyan: #3dd6d0;
    --gold: #f0c060;
    --gold-bright: #ffd680;
    --gold-glow: rgba(240,192,96,0.5);
    --orange: #f0a050;
    --green: #4ecb7c;
    --blue: #4da8f0;
    --purple: #9b6fe8;
    --red: #e85555;
    --tag-fuel: #f0a050;
    --tag-charge: #4ecb7c;
    --tag-meal: #4da8f0;
    --tag-mall: #9b6fe8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #020510;
    width: 100vw; height: 100vh; overflow: hidden;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    color: var(--text-primary); user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== 整体缩放容器 ========== */
  #app {
    position: absolute;
    left: 0; top: 0;
    width: 1920px; height: 1080px;
    transform-origin: 0 0;
    background: var(--bg-deep);
    overflow: hidden;
    box-shadow: 0 0 100px rgba(0,0,0,0.5);
  }

  /* ========== A: 科技背景网格 ========== */
  .bg-grid {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; z-index: 0;
    background-image:
      linear-gradient(rgba(20,50,90,0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20,50,90,0.15) 1px, transparent 1px);
    background-size: 60px 60px;
    background-position: center center;
  }
  .bg-grid::before {
    content: ''; position: absolute; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background:
      radial-gradient(ellipse at 50% 35%, rgba(30,80,160,0.12) 0%, transparent 60%),
      radial-gradient(ellipse at 30% 65%, rgba(20,60,120,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 60%, rgba(20,60,120,0.08) 0%, transparent 55%);
    animation: bgPulse 8s ease-in-out infinite;
  }
  @keyframes bgPulse {
    0%,100% { opacity: 0.8; }
    50% { opacity: 1; }
  }

  /* ========== A: 浮动光点 ========== */
  .floating-dots { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; }
  .floating-dots .dot {
    position: absolute; width: 3px; height: 3px;
    border-radius: 50%; opacity: 0.5;
    animation: floatDot 6s ease-in-out infinite;
  }
  .floating-dots .dot:nth-child(1) { top: 12%; left: 8%;  animation-delay: 0s;   background: var(--cyan); }
  .floating-dots .dot:nth-child(2) { top: 22%; left: 75%; animation-delay: 1.5s; background: var(--gold); }
  .floating-dots .dot:nth-child(3) { top: 55%; left: 15%; animation-delay: 3s;   background: var(--blue); }
  .floating-dots .dot:nth-child(4) { top: 70%; left: 82%; animation-delay: 4.5s; background: var(--purple); }
  .floating-dots .dot:nth-child(5) { top: 35%; left: 48%; animation-delay: 2s;   background: var(--green); }
  .floating-dots .dot:nth-child(6) { top: 80%; left: 38%; animation-delay: 5s;   background: var(--orange); }
  @keyframes floatDot {
    0%,100% { transform: translateY(0) translateX(0); opacity: 0.3; }
    25%     { transform: translateY(-30px) translateX(15px); opacity: 0.7; }
    50%     { transform: translateY(-15px) translateX(-10px); opacity: 0.4; }
    75%     { transform: translateY(-40px) translateX(8px); opacity: 0.6; }
  }

  /* ========== 三栏布局 ========== */
  .full-panel {
    position: relative; z-index: 1;
    display: flex; flex-direction: row;
    width: 100%; height: 100%;
    padding: 60px 16px 10px 16px;
    gap: 8px;
  }
  .left-panel {
    flex: 0 0 22%; display: flex; flex-direction: column; gap: 8px; min-height: 0;
  }
  .center-panel {
    flex: 1; display: flex; flex-direction: column; gap: 8px; min-height: 0;
  }
  .right-panel {
    flex: 0 0 22%; display: flex; flex-direction: column; gap: 8px; min-height: 0;
  }

  /* ========== B: 标题栏 ========== */
  .title-bar {
    display: flex; align-items: center; justify-content: center;
    gap: 24px; flex-shrink: 0;
    padding: 6px 0;
  }
  .title-line {
    height: 1px; width: 80px;
    background: linear-gradient(90deg, transparent, rgba(61,214,208,0.5));
  }
  .title-line.r {
    background: linear-gradient(90deg, rgba(61,214,208,0.5), transparent);
  }
  .title-center { text-align: center; }
  .title-sub {
    font-size: 13px; color: rgba(168,188,220,0.35); letter-spacing: 6px;
  }
  .title-main {
    font-size: 26px; font-weight: 700; letter-spacing: 4px;
    background: linear-gradient(180deg, #ffffff 0%, #c0d6f0 60%, #8ab8e0 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .title-info {
    font-size: 12px; color: rgba(168,188,220,0.4); margin-top: 2px;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .status-dot {
    display: inline-block; width: 6px; height: 6px;
    background: var(--green); border-radius: 50%;
    animation: breathe 2s ease-in-out infinite;
    vertical-align: middle;
  }
  @keyframes breathe {
    0%,100% { opacity: 1; box-shadow: 0 0 4px var(--green); }
    50% { opacity: 0.4; box-shadow: 0 0 14px var(--green); }
  }
  /* B: 状态徽章 */
  .status-badge {
    font-size: 12px; color: var(--cyan); letter-spacing: 2px;
    border: 1px solid rgba(61,214,208,0.4);
    padding: 2px 10px; border-radius: 12px;
    animation: badgePulse 3s ease-in-out infinite;
    white-space: nowrap;
  }
  @keyframes badgePulse {
    0%,100% { border-color: rgba(61,214,208,0.4); }
    50% { border-color: rgba(61,214,208,0.85); }
  }

  /* ========== C: 通用卡片样式 ========== */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border-glow);
    border-radius: 10px;
    padding: 14px 16px;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 2px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.02);
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }
  .card:hover {
    border-color: var(--border-active);
    box-shadow: 0 4px 30px rgba(20,60,130,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(100,160,220,0.5), transparent);
    opacity: 0.6;
  }

  /* ========== C: 卡片标题 ========== */
  .card-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px; flex-shrink: 0;
  }
  .card-title {
    font-size: 15px; font-weight: 600;
    color: var(--text-secondary); letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
  }
  .card-title::before {
    content: ''; display: inline-block;
    width: 3px; height: 16px; border-radius: 2px;
    background: var(--blue);
  }
  .card-badge {
    font-size: 11px; color: var(--cyan);
    border: 1px solid rgba(61,214,208,0.35);
    padding: 3px 10px; border-radius: 12px;
    letter-spacing: 1px; white-space: nowrap;
  }



  /* ========== F: 实时订单滚动 ========== */
  .order-scroll-card {
    flex: 1; min-height: 0; display: flex; flex-direction: column;
  }
  .order-scroll-wrapper {
    flex: 1; overflow: hidden; position: relative;
    mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 8%, black 92%, transparent 100%);
  }
  .order-list-inner {
    animation: scrollOrders 18s linear infinite;
  }
  .order-list-inner:hover {
    animation-play-state: paused;
  }
  @keyframes scrollOrders {
    0% { transform: translateY(0); }
    100% { transform: translateY(-50%); }
  }
  .order-item {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 14px; font-size: 14px;
    border-bottom: 1px solid rgba(26,61,110,0.4);
    transition: background 0.3s ease; white-space: nowrap;
  }
  .order-item:hover {
    background: rgba(30,60,110,0.3);
  }
  .order-tag {
    font-size: 13px; padding: 4px 10px; border-radius: 10px;
    font-weight: 600; letter-spacing: 1px; flex-shrink: 0; width: 48px; text-align: center;
  }
  .order-tag.tag-fuel {
    background: rgba(240,160,80,0.2); color: var(--tag-fuel);
    border: 1px solid rgba(240,160,80,0.35);
  }
  .order-tag.tag-charge {
    background: rgba(78,203,124,0.2); color: var(--tag-charge);
    border: 1px solid rgba(78,203,124,0.35);
  }
  .order-tag.tag-meal {
    background: rgba(77,168,240,0.2); color: var(--tag-meal);
    border: 1px solid rgba(77,168,240,0.35);
  }
  .order-tag.tag-mall {
    background: rgba(155,111,232,0.2); color: var(--tag-mall);
    border: 1px solid rgba(155,111,232,0.35);
  }
  .order-user {
    color: #c8d8f0; flex-shrink: 0; width: 72px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .order-merchant {
    color: var(--text-muted); flex-shrink: 0; width: 140px;
    overflow: hidden; text-overflow: ellipsis;
  }
  .order-amount {
    color: var(--gold); font-weight: 700; flex-shrink: 0; width: 84px; text-align: right;
    margin-left: auto;
  }
  .order-time {
    color: var(--text-muted); font-size: 13px; flex-shrink: 0; width: 60px; text-align: right;
  }

  /* ========== 今日系统数据卡片 ========== */
  .today-metrics {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 5px 10px; padding: 2px 0;
  }
  .today-metric-item {
    display: flex; flex-direction: column;
    padding: 10px 12px;
    border-radius: 6px;
    background: rgba(10,25,50,0.4);
    border: 1px solid rgba(26,61,110,0.3);
    transition: all 0.3s ease;
  }
  .today-metric-item:hover {
    border-color: var(--border-active);
    background: rgba(15,35,65,0.6);
  }
  .tm-label {
    font-size: 16px; color: var(--text-muted);
    letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .tm-value {
    font-size: 36px; font-weight: 800; color: #d0e0f8;
    font-variant-numeric: tabular-nums; line-height: 1.1;
  }
  .tm-value.gold {
    color: var(--gold-bright);
    text-shadow: 0 0 10px var(--gold-glow);
  }
  .tm-unit {
    font-size: 12px; color: var(--text-muted); font-weight: 400;
  }

  /* ========== 地图卡片 ========== */
  .map-card {
    flex: 1; min-height: 0; position: relative;
    display: flex; flex-direction: column;
    background: var(--bg-card); border: 1px solid var(--border-glow);
    border-radius: 10px; overflow: hidden;
    box-shadow: 0 2px 20px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.02);
  }
  .map-card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(100,160,220,0.5), transparent);
    opacity: 0.6; z-index: 2;
  }
  /* 地图右上角：服务区排名 */
  .map-rank {
    position: absolute; right: 12px; top: 52px; z-index: 4;
    background: rgba(10,28,55,0.6); border: 1px solid rgba(61,214,208,0.25);
    border-radius: 8px; padding: 10px 14px;
    backdrop-filter: blur(6px); min-width: 155px;
  }
  .mr-title {
    color: var(--cyan); font-size: 13px; font-weight: 600;
    letter-spacing: 1px; margin-bottom: 6px; padding-bottom: 5px;
    border-bottom: 1px solid rgba(61,214,208,0.15);
  }
  .mr-list { display: flex; flex-direction: column; gap: 4px; }
  .mr-item { display: flex; align-items: center; gap: 8px; }
  .mr-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: rgba(61,214,208,0.3); color: #b0c8e0;
    font-size: 12px; font-weight: 700; text-align: center; line-height: 20px;
    flex-shrink: 0;
  }
  .mr-name { font-size: 13px; color: #c8d8f0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mr-val { font-size: 14px; color: var(--cyan); font-weight: 600; font-variant-numeric: tabular-nums; }

  #map-container {
    flex: 1; min-height: 0; width: 100%;
  }
  .map-hint {
    position: absolute; bottom: 14px; right: 18px; z-index: 5;
    font-size: 11px; color: var(--text-muted);
    background: rgba(0,0,0,0.4); padding: 4px 12px;
    border-radius: 12px; border: 1px solid rgba(61,214,208,0.3);
  }

  /* ========== 路况面板（地图左上角） ========== */
  .road-panel {
    position: absolute; top: 52px; left: 12px; z-index: 10;
    background: rgba(10,28,55,0.6); border: 1px solid rgba(61,214,208,0.25);
    border-radius: 8px; padding: 10px 14px;
    min-width: 136px; backdrop-filter: blur(6px);
  }
  .rp-title {
    color: var(--cyan); font-size: 13px; font-weight: 600;
    letter-spacing: 1px; margin-bottom: 6px; padding-bottom: 5px;
    border-bottom: 1px solid rgba(61,214,208,0.15);
  }
  .rp-list { display: flex; flex-direction: column; gap: 5px; }
  .rp-item {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #d0dcef;
  }
  .rp-dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }
  .rp-dot.accident { background: var(--red); box-shadow: 0 0 6px var(--red); }
  .rp-dot.construction { background: var(--orange); box-shadow: 0 0 6px var(--orange); }
  .rp-dot.control { background: var(--blue); box-shadow: 0 0 6px var(--blue); }
  .rp-dot.jam { background: var(--gold); box-shadow: 0 0 6px rgba(240,192,96,0.6); }
  .rp-label { flex: 1; }
  .rp-count { font-weight: 700; font-size: 14px; }

  /* ========== G: 业务汇总色块卡片 ========== */
  .biz-card-list { display: flex; flex-direction: column; gap: 6px; }
  .biz-card {
    background: rgba(10,25,50,0.5);
    border: 1px solid rgba(26,61,110,0.35);
    border-radius: 8px;
    padding: 16px 18px;
    display: flex; flex-direction: column; gap: 9px;
    transition: all 0.3s ease;
    position: relative; overflow: hidden;
    flex: 1;
  }
  .biz-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    border-radius: 0 2px 2px 0;
  }
  .biz-card:hover { border-color: var(--border-active); background: rgba(15,35,65,0.6); transform: translateX(2px); }
  .biz-card.fuel::before { background: var(--tag-fuel); }
  .biz-card.charge::before { background: var(--tag-charge); }
  .biz-card.etc::before { background: var(--tag-meal); }
  .biz-card.meal::before { background: var(--purple); }
  .biz-card.mall-points::before { background: var(--gold); }
  .biz-card.mall-wanmei::before { background: var(--cyan); }
  .biz-card-top {
    display: flex; align-items: center; gap: 12px;
  }
  .biz-card-icon {
    width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 700;
  }
  .biz-card-icon.fuel { background: rgba(240,160,80,0.2); color: var(--tag-fuel); border: 1px solid rgba(240,160,80,0.3); }
  .biz-card-icon.charge { background: rgba(78,203,124,0.2); color: var(--tag-charge); border: 1px solid rgba(78,203,124,0.3); }
  .biz-card-icon.etc { background: rgba(77,168,240,0.2); color: var(--tag-meal); border: 1px solid rgba(77,168,240,0.3); }
  .biz-card-icon.meal { background: rgba(155,111,232,0.2); color: var(--purple); border: 1px solid rgba(155,111,232,0.3); }
  .biz-card-icon.mall-points { background: rgba(240,192,96,0.2); color: var(--gold); border: 1px solid rgba(240,192,96,0.3); }
  .biz-card-icon.mall-wanmei { background: rgba(61,214,208,0.2); color: var(--cyan); border: 1px solid rgba(61,214,208,0.3); }
  .biz-card-name { font-size: 18px; color: #d0dcef; font-weight: 600; flex: 1; }
  .biz-card-pct { font-size: 15px; color: var(--text-muted); }
  .biz-card-bottom {
    display: flex; align-items: baseline; gap: 16px;
  }
  .biz-card-amount {
    font-size: 30px; font-weight: 700; color: var(--gold);
    font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
  }
  .biz-card-count {
    font-size: 15px; color: var(--text-secondary);
  }
  .biz-card-change {
    font-size: 15px; font-weight: 600; margin-left: auto;
  }
  .biz-card-change.up { color: var(--red); }
  .biz-card-change.down { color: var(--green); }

  /* ========== G2: 活动参与列表 ========== */
  .act-list { display: flex; flex-direction: column; gap: 3px; }
  .act-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 6px;
    background: rgba(10,25,50,0.4);
    border: 1px solid rgba(26,61,110,0.2);
    transition: all 0.3s ease;
  }
  .act-item:hover { border-color: var(--border-active); background: rgba(15,35,65,0.5); }
  .act-name {
    font-size: 13px; color: #c8d8f0;
    display: flex; align-items: center; gap: 8px;
  }
  .act-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .act-dot.green { background: var(--green); animation: actPulse 2s ease-in-out infinite; }
  .act-dot.blue { background: var(--blue); animation: actPulse 2s ease-in-out 0.7s infinite; }
  .act-dot.orange { background: var(--orange); animation: actPulse 2s ease-in-out 1.4s infinite; }
  @keyframes actPulse {
    0%,100% { opacity: 0.4; box-shadow: 0 0 0px transparent; }
    50% { opacity: 1; box-shadow: 0 0 8px currentColor; }
  }
  .act-count { font-size: 15px; font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; }
  .act-unit { font-size: 11px; color: var(--text-muted); }

  /* ========== I: 数值跳动动画 ========== */
  .value-flash {
    animation: valueFlash 0.5s ease-out;
  }
  @keyframes valueFlash {
    0% { transform: scale(1.08); opacity: 0.6; }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>
<div id="app">
  <!-- A: 背景效果 -->
  <div class="bg-grid"></div>
  <div class="floating-dots">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
  </div>

  <!-- 三栏全屏布局 -->
  <div class="full-panel">
    <!-- ==================== 左侧面板 ==================== -->
    <div class="left-panel">
      <!-- 累计数据 -->
      <div class="card" id="card-acc-data" style="flex:0 0 auto;">
        <div class="card-header">
          <span class="card-title">累计数据</span>
          <span class="card-badge">全量</span>
        </div>
        <div class="today-metrics" id="acc-metrics-container"></div>
      </div>
      <!-- 业务汇总 -->
      <div class="card" id="card-biz-summary" style="flex:1; min-height:0;">
        <div class="card-header">
          <span class="card-title">业务汇总</span>
          <span class="card-badge">今日·实时</span>
        </div>
        <div class="biz-card-list" id="biz-card-list"></div>
      </div>
    </div>

    <!-- ==================== 中间面板 ==================== -->
    <div class="center-panel">
      <!-- B: 标题栏 -->
      <div class="title-bar">
        <div class="title-line"></div>
        <div class="title-center">
          <div class="title-sub">安徽省高速公路出行服务</div>
          <div class="title-main">皖美 e 行 · 一体化出行服务平台</div>
          <div class="title-info">
            <span class="status-dot"></span>
            <span id="current-date">2026-07-22</span>
            <span>· 系统运行中</span>
            <span class="status-badge">● 实时监控中</span>
            <span>· 上次刷新 <span id="refresh-time">--:--:--</span></span>
          </div>
        </div>
        <div class="title-line r"></div>
      </div>

      <!-- 安徽省服务区订单热力图 -->
      <div class="map-card">
        <div class="road-panel" id="road-panel">
          <div class="rp-title">全省路况</div>
          <div class="rp-list" id="rp-list"></div>
        </div>
        <div class="map-rank">
          <div class="mr-title">服务区订单量 TOP5</div>
          <div class="mr-list" id="map-rank-list"></div>
        </div>

<script>
(function() {

  // ========== 模拟数据 ==========

  // 实时订单模板

    { tag: '订餐', tagClass: 'tag-meal', user: '王先生', merchant: '驿达餐厅·黄山服务区', amount: '¥68.00', time: '14:28:42' },
    { tag: '加油', tagClass: 'tag-fuel', user: '赵车主', merchant: '石化公司蚌埠站', amount: '¥512.20', time: '14:25:30' },
    { tag: '商城', tagClass: 'tag-mall', user: '周女士', merchant: '安徽特产商城', amount: '¥298.00', time: '14:22:15' },
    { tag: '充电', tagClass: 'tag-charge', user: '陈先生', merchant: '交控石油充电站', amount: '¥41.60', time: '14:19:08' },
    { tag: 'ETC', tagClass: 'tag-fuel', user: '刘车主', merchant: '安徽ETC·合肥站', amount: '¥128.00', time: '14:16:55' },

  // ========== 工具函数 ==========
  function rr(base, percent) {
    return Math.round(base * (1 + (Math.random() - 0.5) * 2 * percent));

  function fmtNum(n) { return n.toLocaleString(); }
  function fmtWan(n) { return (n / 10000).toFixed(1); }

  // ========== 刷新时间显示 ==========
  function updateTime() {
    var now = new Date();
    var timeStr = now.getHours().toString().padStart(2,'0') + ':' +
      now.getMinutes().toString().padStart(2,'0') + ':' +
      now.getSeconds().toString().padStart(2,'0');
    var rt = document.getElementById('refresh-time');
    if (rt) rt.textContent = timeStr;
  }

  // ========== 渲染函数 ==========
  
  // 累计数据（静态，第1列用户/订单，第2列积分）
  function renderAccData() {
    var container = document.getElementById('acc-metrics-container');
    if (!container) return;
    var d = mockData.accData;
    var h = '';
    h += '<div class="today-metric-item"><span class="tm-label">累计用户数</span><span><span class="tm-value gold">' + fmtWan(d.totalUsers) + '</span><span class="tm-unit"> 万人</span></span></div>';
    h += '<div class="today-metric-item"><span class="tm-label">累计积分发放</span><span><span class="tm-value">' + fmtWan(d.accPointsIssued) + '</span><span class="tm-unit"> 万分</span></span></div>';
    h += '<div class="today-metric-item"><span class="tm-label">累计订单数</span><span><span class="tm-value">' + fmtWan(d.totalOrderCount) + '</span><span class="tm-unit"> 万笔</span></span></div>';
    h += '<div class="today-metric-item"><span class="tm-label">累计积分兑换</span><span><span class="tm-value">' + fmtWan(d.accPointsExchanged) + '</span><span class="tm-unit"> 万分</span></span></div>';
    h += '<div class="today-metric-item"><span class="tm-label">累计订单金额</span><span><span class="tm-value gold">' + fmtWan(d.totalOrderAmount) + '</span><span class="tm-unit"> 万元</span></span></div>';
    h += '<div class="today-metric-item"><span class="tm-label">累计积分核销</span><span><span class="tm-value">' + fmtWan(d.accPointsUsed) + '</span><span class="tm-unit"> 万分</span></span></div>';
    container.innerHTML = h;
  }

  // 业务汇总（色块卡片）
  var bizDefs = [
    { key: 'fuel', icon: '油', cls: 'fuel', name: '加油加气', countUnit: '笔' },
    { key: 'charge', icon: '电', cls: 'charge', name: '充电', countUnit: '笔' },
    { key: 'meal', icon: '餐', cls: 'meal', name: '订餐', countUnit: '笔' },
    { key: 'mallWanmei', icon: '皖', cls: 'mall-wanmei', name: '皖美商城', countUnit: '笔' },
    { key: 'mallPoints', icon: '积', cls: 'mall-points', name: '积分商城', countUnit: '笔' }
  ];

  function renderBizSummary() {
    var container = document.getElementById('biz-card-list');
    if (!container) return;
    var h = '';
    for (var i = 0; i < bizDefs.length; i++) {
      var def = bizDefs[i];
      var d = mockData.bizData[def.key];
      var chgCls = d.change >= 0 ? 'up' : 'down';
      var chgSign = d.change >= 0 ? '↑' : '↓';
      h += '<div class="biz-card ' + def.cls + '">' +
        '<div class="biz-card-top">' +
          '<span class="biz-card-icon ' + def.cls + '">' + def.icon + '</span>' +
          '<span class="biz-card-name">' + def.name + '</span>' +
          '<span class="biz-card-pct" id="biz-pct-' + def.key + '">占比 ' + d.pct.toFixed(1) + '%</span>' +
        '</div>' +
        '<div class="biz-card-bottom">' +
          '<span class="biz-card-amount" id="biz-amt-' + def.key + '">' + (def.key === 'mallPoints' ? '' : '¥') + fmtNum(d.amount) + '</span>' +
          '<span class="biz-card-count" id="biz-cnt-' + def.key + '">' + fmtNum(d.count) + ' ' + def.countUnit + '</span>' +
          '<span class="biz-card-change ' + chgCls + '" id="biz-chg-' + def.key + '">' + chgSign + ' ' + Math.abs(d.change).toFixed(1) + '%</span>' +
        '</div>' +
        '</div>';
    }
    container.innerHTML = h;
  }

  // 实时数据（2×3网格，数字跳动，与左侧累计一一对应）
  function renderRealtimeData() {
    var container = document.getElementById('realtime-metrics-container');
    if (!container) return;
    var d = mockData.realtimeData;
    var h = '';
    h += '<div class="today-metric-item"><span class="tm-label">当前在线人数</span><span><span class="tm-value gold" id="rt-online">' + fmtNum(d.onlineUsers) + '</span><span class="tm-unit"> 人</span></span></div>';
    h += '<div class="today-metric-item"><span class="tm-label">今日积分发放</span><span><span class="tm-value" id="rt-points">' + fmtWan(d.pointsToday) + '</span><span class="tm-unit"> 万分</span></span></div>';
    h += '<div class="today-metric-item"><span class="tm-label">今日订单总量</span><span><span class="tm-value" id="rt-orders">' + fmtNum(d.orders) + '</span><span class="tm-unit"> 笔</span></span></div>';
    h += '<div class="today-metric-item"><span class="tm-label">今日积分兑换</span><span><span class="tm-value" id="rt-exchanged">' + fmtWan(d.todayExchanged) + '</span><span class="tm-unit"> 万分</span></span></div>';
    h += '<div class="today-metric-item"><span class="tm-label">今日订单金额</span><span><span class="tm-value gold" id="rt-amount">' + fmtNum(d.orderAmount) + '</span><span class="tm-unit"> 元</span></span></div>';
    h += '<div class="today-metric-item"><span class="tm-label">今日核销量</span><span><span class="tm-value" id="rt-verified">' + fmtNum(d.verified) + '</span><span class="tm-unit"> 笔</span></span></div>';
    container.innerHTML = h;

  // 活动参与情况
  function renderActivity() {
    var container = document.getElementById('act-list');
    if (!container) return;
    var dotClasses = ['green', 'blue', 'orange'];
    var h = '';
    for (var i = 0; i < mockData.actData.length; i++) {
      var a = mockData.actData[i];
      h += '<div class="act-item">' +
        '<span class="act-name"><span class="act-dot ' + dotClasses[i] + '"></span>' + a.name + '</span>' +
        '<span><span class="act-count" id="act-count-' + i + '">' + fmtNum(a.count) + '</span><span class="act-unit"> 人</span></span>' +
        '</div>';

  // 实时订单（CSS自动滚动，双倍数据无缝循环）
  function renderOrders() {
    var ct = document.getElementById('order-list-inner');
    if (!ct) return;
    var items = orderTemplates.concat(orderTemplates);
    var h = '';
    for (var i = 0; i < items.length; i++) {
      var o = items[i];
      h += '<div class="order-item">' +
        '<span class="order-tag ' + o.tagClass + '">' + o.tag + '</span>' +

        '<span class="order-merchant">' + o.merchant + '</span>' +

  function renderServiceAreaRank() {
    var container = document.getElementById('map-rank-list');

      var r = mockData.serviceAreaRank[i];

        '<span class="mr-name">' + r.name + '</span>' +

  function renderRoadPanel() {

  // ========== 刷新逻辑（5s间隔、数字微调跳动） ==========
  function flashEl(el) {
    if (!el) return;
    el.classList.remove('value-flash');
    void el.offsetWidth;
    el.classList.add('value-flash');
  }

  function refreshAllCards() {
    // 业务汇总微调
    var totalAmt = 0;
    for (var i = 0; i < bizDefs.length; i++) {
      var d = mockData.bizData[bizDefs[i].key];
      d.amount = rr(d.amount, 0.008);
      d.count = rr(d.count, 0.01);
      d.change = parseFloat((d.change + (Math.random() - 0.5) * 0.4).toFixed(1));
      totalAmt += d.amount;
    }
    // 重新计算占比
    for (var i = 0; i < bizDefs.length; i++) {
      var d = mockData.bizData[bizDefs[i].key];
      d.pct = parseFloat((d.amount / totalAmt * 100).toFixed(1));
      var key = bizDefs[i].key;
      var chgCls = d.change >= 0 ? 'up' : 'down';
      var chgSign = d.change >= 0 ? '↑' : '↓';
      var elAmt = document.getElementById('biz-amt-' + key);
      var elCnt = document.getElementById('biz-cnt-' + key);
      var elChg = document.getElementById('biz-chg-' + key);
      if (elAmt) { elAmt.textContent = (key === 'mallPoints' ? '' : '¥') + fmtNum(d.amount); flashEl(elAmt); }
      if (elCnt) elCnt.textContent = fmtNum(d.count) + ' ' + bizDefs[i].countUnit;
      var elPct = document.getElementById('biz-pct-' + key);
      if (elPct) elPct.textContent = '占比 ' + d.pct.toFixed(1) + '%';
      if (elChg) {
        elChg.textContent = chgSign + ' ' + Math.abs(d.change).toFixed(1) + '%';
        elChg.className = 'biz-card-change ' + chgCls;
      }
    }
    // 实时数据微调
    var rt = mockData.realtimeData;
    rt.onlineUsers = rr(rt.onlineUsers, 0.04);
    rt.orders = rr(rt.orders, 0.02);
    rt.orderAmount = rr(rt.orderAmount, 0.01);
    rt.pointsToday = rr(rt.pointsToday, 0.02);
    rt.todayExchanged = rr(rt.todayExchanged, 0.02);
    rt.verified = rr(rt.verified, 0.02);
    var rtUpdates = {
      'rt-online': fmtNum(rt.onlineUsers),
      'rt-orders': fmtNum(rt.orders),
      'rt-amount': fmtNum(rt.orderAmount),
      'rt-points': fmtWan(rt.pointsToday),
      'rt-exchanged': fmtWan(rt.todayExchanged),
      'rt-verified': fmtNum(rt.verified)
    };
    var rtKeys = Object.keys(rtUpdates);
    for (var k = 0; k < rtKeys.length; k++) {
      var el = document.getElementById(rtKeys[k]);
      if (el) {
        el.textContent = rtUpdates[rtKeys[k]];
        flashEl(el);
      }
    }
    // 活动参与微调
    for (var i = 0; i < mockData.actData.length; i++) {
      mockData.actData[i].count = rr(mockData.actData[i].count, 0.01);
      var actEl = document.getElementById('act-count-' + i);
      if (actEl) {
        actEl.textContent = fmtNum(mockData.actData[i].count);
        flashEl(actEl);
      }
    }
    // 服务区排名微调
    for (var i = 0; i < mockData.serviceAreaRank.length; i++) {
      mockData.serviceAreaRank[i].orders = rr(mockData.serviceAreaRank[i].orders, 0.03);
    }
    var mrItems = document.querySelectorAll('#map-rank-list .mr-val');
    for (var i = 0; i < mrItems.length; i++) {
      mrItems[i].textContent = mockData.serviceAreaRank[i].orders + ' 单';
    }
    // 路况事件微调
    for (var i = 0; i < mockData.roadData.length; i++) {
      mockData.roadData[i].count = rr(mockData.roadData[i].count, 0.05);
      var rpEl = document.getElementById('rp-' + mockData.roadData[i].cls);
      if (rpEl) rpEl.textContent = mockData.roadData[i].count;
    }
    updateTime();
  }

  function startRefreshLoop() {
    updateTime();
    setInterval(refreshAllCards, 5000);
  }

            symbolSize: function(val) { return Math.max(6, Math.sqrt(val[2]) / 0.7); },
            showEffectOn: 'render',
            rippleEffect: { brushType: 'stroke', scale: 3.5, period: 3.5, color: '#3dd6d0' },
            label: { show: true, position: 'right', distance: 6, formatter: '{b}', color: '#e0f0ff', fontSize: 11, fontWeight: 'bold', textShadowBlur: 4, textShadowColor: 'rgba(0,0,0,0.7)' },
            itemStyle: { color: '#90e0ef', shadowBlur: 10, shadowColor: 'rgba(61,214,208,0.7)' },
            zlevel: 2
          }]
        });
      })
      .catch(function() {
        mapDom.innerHTML = '<div style="color:#a0b8d4;text-align:center;padding-top:35%;font-size:15px;">地图数据加载中，请确保网络连接正常...</div>';
      });

    window.addEventListener('resize', function() { mapChart.resize(); });
  }

  // ========== 初始化 ==========
  function init() {
    var now = new Date();
    var dateStr = now.getFullYear() + '-' +
      (now.getMonth() + 1).toString().padStart(2, '0') + '-' +
      now.getDate().toString().padStart(2, '0');
    var cd = document.getElementById('current-date');
    if (cd) cd.textContent = dateStr;

    renderAccData();
    renderBizSummary();
    renderRealtimeData();
    renderActivity();
    renderOrders();
    renderServiceAreaRank();
    renderRoadPanel();
    initMap();
    startRefreshLoop();
  }

  init();
})();
</script>
</body>
</html>
