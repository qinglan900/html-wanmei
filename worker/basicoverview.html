<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高速公路营运一体化平台 - 基础数据概览</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
        }
        .map-container svg {
            background: #f2efe6;
        }
        .map-border {
            position: absolute;
            top: 4px;
            left: 4px;
            right: 4px;
            bottom: 4px;
            border: 2px solid #94a3b8;
            border-radius: 6px;
            pointer-events: none;
            z-index: 1;
        }
        .map-border::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
        }
        .city-label {
            font-size: 11px;
            font-weight: 500;
            fill: #475569;
            text-anchor: middle;
            dominant-baseline: central;
            paint-order: stroke;
            stroke: #ffffff;
            stroke-width: 3px;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .city-dot {
            fill: #64748b;
            stroke: #ffffff;
            stroke-width: 1.5;
        }
        .icon-hover:hover {
            transform: scale(1.3);
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }
        .popup-enter {
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== Tailwind 替代 CSS ===== */

        /* Layout */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .flex-1 { flex: 1; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .shrink-0 { flex-shrink: 0; }
        .inline-block { display: inline-block; }
        .hidden { display: none; }
        .absolute { position: absolute; }
        .relative { position: relative; }
        .overflow-hidden { overflow: hidden; }

        /* Typography */
        .text-xs { font-size: 12px; }
        .text-sm { font-size: 14px; }
        .text-base { font-size: 16px; }
        .font-medium { font-weight: 500; }
        .font-bold { font-weight: 700; }
        .tracking-wide { letter-spacing: 0.025em; }

        /* Text colors */
        .text-white { color: #ffffff; }
        .text-gray-400 { color: #9ca3af; }
        .text-gray-500 { color: #6b7280; }
        .text-gray-600 { color: #4b5563; }
        .text-gray-700 { color: #374151; }
        .text-gray-800 { color: #1f2937; }
        .text-green-600 { color: #16a34a; }
        .text-yellow-600 { color: #ca8a04; }
        .text-red-600 { color: #dc2626; }
        .text-purple-600 { color: #9333ea; }
        .text-orange-600 { color: #ea580c; }
        .text-blue-600 { color: #2563eb; }

        /* Borders */
        .rounded-full { border-radius: 50%; }
        .rounded-lg { border-radius: 8px; }
        .rounded-xl { border-radius: 12px; }
        .border { border: 1px solid #e5e7eb; }
        .border-gray-200 { border-color: #e5e7eb; }
        .border-gray-300 { border-color: #d1d5db; }
        .border-b { border-bottom: 1px solid #e5e7eb; }

        /* Backgrounds */
        .bg-white { background-color: #ffffff; }
        .bg-purple-500 { background-color: #8B5CF6; }
        .bg-green-500 { background-color: #22C55E; }
        .bg-orange-500 { background-color: #F97316; }
        .bg-blue-500 { background-color: #3B82F6; }
        .bg-orange-400 { background-color: #fb923c; }
        .bg-blue-400 { background-color: #60a5fa; }

        /* Sizing */
        .w-full { width: 100%; }
        .h-full { height: 100%; }
        .w-48 { width: 192px; }
        .w-24 { width: 96px; }
        .w-6 { width: 24px; }
        .h-6 { height: 24px; }
        .w-3 { width: 12px; }
        .h-3 { height: 12px; }
        .w-2\.5 { width: 10px; }
        .h-2\.5 { height: 10px; }
        .w-4 { width: 16px; }
        .h-4 { height: 16px; }

        /* Spacing */
        .p-3\.5 { padding: 14px; }
        .px-2 { padding-left: 8px; padding-right: 8px; }
        .px-4 { padding-left: 16px; padding-right: 16px; }
        .py-1 { padding-top: 4px; padding-bottom: 4px; }
        .py-1\.5 { padding-top: 6px; padding-bottom: 6px; }
        .py-2 { padding-top: 8px; padding-bottom: 8px; }
        .py-2\.5 { padding-top: 10px; padding-bottom: 10px; }
        .py-3 { padding-top: 12px; padding-bottom: 12px; }
        .pl-4 { padding-left: 16px; }
        .mb-2\.5 { margin-bottom: 10px; }

        /* Flex gap utilities (space-*) */
        .space-y-2 { gap: 8px; display: flex; flex-direction: column; }
        .space-y-1 { gap: 4px; display: flex; flex-direction: column; }
        .space-x-2 { gap: 8px; display: flex; align-items: center; }
        .space-x-1 { gap: 4px; display: flex; align-items: center; }
        .space-x-1\.5 { gap: 6px; display: flex; align-items: center; }

        /* Interactive */
        .cursor-pointer { cursor: pointer; }
        .transition-colors { transition: background-color 0.2s; }
        .transition-all { transition: all 0.2s; }
        .duration-200 { transition-duration: 0.2s; }

        /* Z-index & effects */
        .z-20 { z-index: 20; }
        .z-50 { z-index: 50; }
        .backdrop-blur { backdrop-filter: blur(4px); }
        .shadow-lg { box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .shadow-2xl { box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25); }

        /* Divide */
        .divide-y > * + * { border-top: 1px solid #f3f4f6; }

        /* Ring styles used by JS */
        .ring-2 { box-shadow: 0 0 0 2px; }
        .ring-purple-400 { box-shadow: 0 0 0 2px #c084fc; }
        .ring-green-400 { box-shadow: 0 0 0 2px #4ade80; }
        .ring-orange-400 { box-shadow: 0 0 0 2px #fb923c; }
        .ring-blue-400 { box-shadow: 0 0 0 2px #60a5fa; }

        /* Hover effects per legend type */
        .legend-item[data-type="service_area"]:hover,
        .legend-subitem[data-type="service_area"]:hover { background-color: #faf5ff; }
        .legend-item[data-type="toll_station"]:hover,
        .legend-subitem[data-type="toll_station"]:hover { background-color: #f0fdf4; }
        .legend-item[data-type="petrol_station"]:hover,
        .legend-subitem[data-type="petrol_station"]:hover { background-color: #fff7ed; }
        .legend-item[data-type="charging_station"]:hover,
        .legend-subitem[data-type="charging_station"]:hover { background-color: #eff6ff; }

        .hover\:text-gray-600:hover { color: #4b5563; }
    </style>
</head>

<script>
let currentPopup = null;
let activeFilter = 'service_area';
let activeSubtype = null;

function init() {
    renderMapIcons('service_area');
    updateLegendActive('service_area');
}

function updateLegendActive(type, subtype) {
    document.querySelectorAll('.legend-item, .legend-subitem').forEach(el => {
        el.classList.remove('ring-2', 'ring-offset-1', 'ring-opacity-60', 'ring-purple-400', 'ring-green-400', 'ring-orange-400', 'ring-blue-400');
    });
    
    if (type === 'service_area') {
        document.querySelectorAll(`.legend-item[data-type="${type}"]`).forEach(el => {
            el.classList.add('ring-2', 'ring-offset-1', 'ring-opacity-60', 'ring-purple-400');
        });
    } else if (type === 'toll_station') {
        document.querySelectorAll(`.legend-item[data-type="${type}"]`).forEach(el => {
            el.classList.add('ring-2', 'ring-offset-1', 'ring-opacity-60', 'ring-green-400');
        });
    } else if (type === 'petrol_station') {
        if (subtype) {
            document.querySelectorAll(`.legend-subitem[data-type="${type}"][data-subtype="${subtype}"]`).forEach(el => {
                el.classList.add('ring-2', 'ring-offset-1', 'ring-opacity-60', 'ring-orange-400');
            });
        } else {
            document.querySelectorAll(`.legend-item[data-type="${type}"]`).forEach(el => {
                el.classList.add('ring-2', 'ring-offset-1', 'ring-opacity-60', 'ring-orange-400');
            });
        }
    } else if (type === 'charging_station') {
        if (subtype) {
            document.querySelectorAll(`.legend-subitem[data-type="${type}"][data-subtype="${subtype}"]`).forEach(el => {
                el.classList.add('ring-2', 'ring-offset-1', 'ring-opacity-60', 'ring-blue-400');
            });
        } else {
            document.querySelectorAll(`.legend-item[data-type="${type}"]`).forEach(el => {
                el.classList.add('ring-2', 'ring-offset-1', 'ring-opacity-60', 'ring-blue-400');
            });
        }
    }
}

function renderMapIcons(filterType = 'all', filterSubtype = null) {
    const container = document.getElementById('facilities');
    container.innerHTML = '';
    
    let filtered;
    if (filterType === 'all') {
        filtered = facilities;
    } else if (filterSubtype) {
        if (filterType === 'petrol_station') {
            filtered = facilities.filter(f => f.type === filterType && f.station_type === filterSubtype);
        } else if (filterType === 'charging_station') {
            filtered = facilities.filter(f => f.type === filterType && f.brand === filterSubtype);
        } else {
            filtered = facilities.filter(f => f.type === filterType);
        }
    } else {
        filtered = facilities.filter(f => f.type === filterType);
    }
    
    filtered.forEach(facility => {
        const icon = createIcon(facility);
        container.appendChild(icon);
    });
}

function createIcon(facility) {
    const group = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    group.setAttribute('transform', `translate(${facility.x}, ${facility.y})`);
    group.setAttribute('style', 'cursor: pointer;');
    group.setAttribute('onclick', `showPopup(event, '${facility.id}')`);
    
    const colors = {
        service_area: '#8B5CF6',
        toll_station: '#22C55E',
        petrol_station: '#F97316',
        charging_station: '#3B82F6'
    };
    
    const color = colors[facility.type];
    
    const bgCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    bgCircle.setAttribute('r', '18');
    bgCircle.setAttribute('fill', color);
    bgCircle.setAttribute('stroke', '#ffffff');
    bgCircle.setAttribute('stroke-width', '2.5');
    bgCircle.setAttribute('filter', 'url(#shadow)');
    group.appendChild(bgCircle);
    
    const hoverCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    hoverCircle.setAttribute('r', '22');
    hoverCircle.setAttribute('fill', color);
    hoverCircle.setAttribute('opacity', '0');
    hoverCircle.setAttribute('style', 'transition: opacity 0.2s;');
    group.appendChild(hoverCircle);
    
    group.addEventListener('mouseenter', () => {
        hoverCircle.setAttribute('opacity', '0.2');
    });
    
    group.addEventListener('mouseleave', () => {
        hoverCircle.setAttribute('opacity', '0');
    });
    
    return group;
}

function showPopup(event, facilityId) {
    const facility = facilities.find(f => f.id === facilityId);
    if (!facility) return;
    
    closePopup();
    
    const popup = document.getElementById('popup');
    const title = document.getElementById('popup-title');
    const content = document.getElementById('popup-content');
    const badge = document.getElementById('popup-badge');
    
    title.textContent = facility.name;
    
    const colorMap = {
        service_area: '#8B5CF6',
        toll_station: '#22C55E',
        petrol_station: '#F97316',
        charging_station: '#3B82F6'
    };
    badge.style.backgroundColor = colorMap[facility.type];
    
    let html = '<div class="divide-y divide-gray-100">';
    
    if (facility.type === 'toll_station') {
        html += `
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">收费站名称</span><span class="text-gray-700 text-sm">${facility.toll_name}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">收费站编码</span><span class="text-gray-700 text-sm">${facility.toll_code}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">所属高速</span><span class="text-gray-700 text-sm">${facility.highway_name}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">桩号</span><span class="text-gray-700 text-sm">${facility.pile_number}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">状态</span><span class="text-sm font-medium ${facility.status === '正常运营' ? 'text-green-600' : 'text-yellow-600'}">${facility.status}</span></div>
        `;
    } else if (facility.type === 'service_area') {
        html += `
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">服务区名称</span><span class="text-gray-700 text-sm">${facility.area_name}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">服务站编码</span><span class="text-gray-700 text-sm">${facility.area_code}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">所属高速</span><span class="text-gray-700 text-sm">${facility.highway_name}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">行车方向</span><span class="text-gray-700 text-sm">${facility.direction}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">服务区状态</span><span class="text-sm font-medium ${facility.status === '正常运营' ? 'text-green-600' : 'text-yellow-600'}">${facility.status}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">区域</span><span class="text-gray-700 text-sm">${facility.region}</span></div>
        `;
    } else if (facility.type === 'petrol_station') {
        html += `
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">油站名称</span><span class="text-gray-700 text-sm">${facility.station_name}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">油站编码</span><span class="text-gray-700 text-sm">${facility.station_code}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">加油站类型</span><span class="text-gray-700 text-sm">${facility.station_type}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">所属路段</span><span class="text-gray-700 text-sm">${facility.road_section}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">服务区名称</span><span class="text-gray-700 text-sm">${facility.service_area_name}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">服务区位置</span><span class="text-gray-700 text-sm">${facility.service_area_location}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">服务区编码</span><span class="text-gray-700 text-sm">${facility.service_area_code}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">加油站状态</span><span class="text-sm font-medium ${facility.status === '正常运营' ? 'text-green-600' : 'text-yellow-600'}">${facility.status}</span></div>
        `;
    } else if (facility.type === 'charging_station') {
        html += `
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">充电站品牌</span><span class="text-gray-700 text-sm">${facility.brand}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">服务区名称</span><span class="text-gray-700 text-sm">${facility.service_area_name}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">服务区编码</span><span class="text-gray-700 text-sm">${facility.service_area_code}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">所属高速</span><span class="text-gray-700 text-sm">${facility.highway_name}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">营业时间</span><span class="text-gray-700 text-sm">${facility.business_hours}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">站点状态</span><span class="text-sm font-medium ${facility.station_status === '正常运营' ? 'text-green-600' : 'text-yellow-600'}">${facility.station_status}</span></div>
            <div class="flex py-2"><span class="text-gray-400 text-xs w-24 shrink-0">app状态</span><span class="text-sm font-medium ${facility.app_status === '在线' ? 'text-green-600' : 'text-red-600'}">${facility.app_status}</span></div>
        `;
    }
    
    html += '</div>';
    content.innerHTML = html;
    
    popup.classList.remove('hidden');
    currentPopup = facility;
    
    const mapContainer = document.querySelector('.map-container');
    const rect = mapContainer.getBoundingClientRect();
    const xPercent = (facility.x / 800) * rect.width;
    const yPercent = (facility.y / 650) * rect.height;
    
    let popupX = xPercent + rect.left;
    let popupY = yPercent + rect.top - 20;
    
    if (popupX + 280 > window.innerWidth) {
        popupX = window.innerWidth - 290;
    }
    
    if (popupY < 80) {
        popupY = yPercent + rect.top + 30;
    }
    
    popup.style.left = `${popupX}px`;
    popup.style.top = `${popupY}px`;
    
    document.addEventListener('click', handleOutsideClick);
}

function closePopup() {
    const popup = document.getElementById('popup');
    popup.classList.add('hidden');
    currentPopup = null;
    document.removeEventListener('click', handleOutsideClick);
}

function handleOutsideClick(event) {
    const popup = document.getElementById('popup');
    if (popup && !popup.contains(event.target) && !event.target.closest('svg')) {
        closePopup();
    }
}

function filterFacilities(type, subtype) {
    if (activeFilter === type && activeSubtype === (subtype || null)) return;
    activeFilter = type;
    activeSubtype = subtype || null;
    renderMapIcons(type, subtype || null);
    updateLegendActive(type, subtype);
}

function toggleSubBrands(name) {
    const sub = document.getElementById('sub-' + name);
    if (!sub) return;
    
    if (sub.style.maxHeight === '0px' || sub.style.maxHeight === '0') {
        sub.style.maxHeight = name === 'charge' ? '200px' : '100px';
    } else {
        sub.style.maxHeight = '0px';
    }
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
